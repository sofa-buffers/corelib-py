[build-system]
requires = ["setuptools>=61", "wheel", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sofa-buffers-corelib"
# Read from ``sofab.__version__`` (see [tool.setuptools.dynamic] below): the
# release version lives in exactly one place, so what an install reports can
# never drift from what an import reports.
dynamic = ["version"]
description = "SofaBuffers binary wire-format runtime — pure Python with an optional native (Cython) accelerator"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SofaBuffers" }]
keywords = ["sofabuffers", "serialization", "streaming", "wire-format"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sofa-buffers/corelib-py"

[tool.setuptools]
# The optional C extension is declared in setup.py; keep package data (the
# .pyx source and py.typed marker) in the wheel/sdist.
zip-safe = false

[tool.setuptools.dynamic]
version = { attr = "sofab.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sofab = ["py.typed"]

# The accelerator sources are build inputs, not runtime files: a built wheel
# already contains the compiled extension, so shipping the .pyx and the
# Cython-generated .c on top adds ~1.5 MB of dead weight to every wheel. They
# still travel in the sdist (MANIFEST.in), which is where a from-source build
# needs them.
[tool.setuptools.exclude-package-data]
sofab = ["_speedups.pyx", "_speedups.c"]

[tool.cibuildwheel]
# Wheels exist for one reason: to deliver the compiled accelerator to users who
# have no compiler. A wheel that quietly fell back to pure Python would be worse
# than no wheel — it looks like a platform wheel, installs like one, and is slow.
# setup.py is deliberately tolerant (the extension is optional=True and a failed
# compile degrades to pure Python), which is right for a from-source install and
# wrong here, so every wheel is tested for IMPL == "native" before it may ship.
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
# 32-bit and PyPy: not covered by the test matrix, and not worth the build time.
skip = "*-win32 *_i686 pp*"
build-frontend = "build"
test-requires = "pytest"
test-command = [
    "python -c \"import sofab, sys; sys.exit(0 if sofab.IMPL == 'native' else f'wheel has no accelerator: IMPL={sofab.IMPL}')\"",
    "pytest {project}/tests -q",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Test data tables (byte vectors, parametrize rows) are intentionally wide,
# and compact "advance; assert" lines keep the vector walks readable.
"tests/*" = ["E501", "E702"]

[tool.mypy]
strict = true
files = ["src/sofab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
