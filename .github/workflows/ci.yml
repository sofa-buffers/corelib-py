name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job below carries a `timeout-minutes`. GitHub's default is 360, so a
# step that wedges (a hung pip resolver, a network stall) holds one of the
# organisation's 20 concurrent runner slots for six hours and every other repo
# in the family queues behind it. The bounds here are roughly an order of
# magnitude above the observed runtimes — see each job — so a hang fails fast
# and names itself, while an ordinarily slow run is never cut off.

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    # ~30 s: install plus ruff plus mypy.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # The newest interpreter this package supports. ruff is safe to run
          # once: [tool.ruff] pins target-version = "py39", so its verdict does
          # not depend on the interpreter. mypy is NOT -- it has no
          # python_version in [tool.mypy] and follows the running interpreter --
          # so it runs per leg in the test matrix instead, and here only as a
          # fast gate against the newest.
          python-version: '3.14'
          cache: 'pip'

      - name: Install package and tooling
        # `pip install -e .` builds the native accelerator and is the
        # prerequisite of everything in this repo; mypy resolves
        # `sofab._speedups` through the installed package.
        run: python -m pip install -e . ruff mypy

      - name: Lint (ruff)
        run: ruff check src/sofab tests

      - name: Type-check (mypy)
        run: mypy --strict src/sofab

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: [lint]
    runs-on: ${{ matrix.os }}
    # ~40-50 s per leg on Linux (install, native build, two pytest runs); the
    # macOS and Windows legs compile the accelerator with a different toolchain
    # and run a little longer.
    timeout-minutes: 15
    # bash everywhere, so a step behaves the same on all three runners: the
    # accelerator assertion below embeds a Python expression with quotes that
    # PowerShell would parse by its own rules.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Two axes, and they are not equally valuable.
        #
        #   * INTERPRETER: a type error or a stdlib difference visible only under
        #     3.9 is what the full fan-out catches, and mypy runs per leg. That is
        #     interpreter-specific, not OS-specific, so Linux carries all six.
        #   * OS: everything platform-dependent — the C toolchain that builds the
        #     accelerator, path handling, and the *locale encoding*. This axis was
        #     missing entirely, and it cost us: tests/vectors.py read the shared
        #     vectors without an explicit encoding, so Windows decoded them as
        #     cp1252 and fed double-encoded UTF-8 into the encoder. Eight
        #     conformance failures that a Linux-only matrix could not see, found
        #     only when the release workflow first ran the suite on Windows.
        #
        # So: every interpreter on Linux, plus the boundaries requires-python
        # promises on macOS and Windows. Ten legs instead of eighteen, and the
        # gap that actually bit is closed.
        include:
          - { os: ubuntu-latest, python: '3.9' }
          - { os: ubuntu-latest, python: '3.10' }
          - { os: ubuntu-latest, python: '3.11' }
          - { os: ubuntu-latest, python: '3.12' }
          - { os: ubuntu-latest, python: '3.13' }
          - { os: ubuntu-latest, python: '3.14' }
          - { os: macos-latest, python: '3.9' }
          - { os: macos-latest, python: '3.14' }
          - { os: windows-latest, python: '3.9' }
          - { os: windows-latest, python: '3.14' }
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'

      - name: Install package and tooling
        run: python -m pip install -e . pytest mypy

      # mypy runs per interpreter, not once in the gate: [tool.mypy] sets no
      # python_version, so mypy targets whatever interpreter runs it. With
      # requires-python = ">=3.9" that means a type error visible only under 3.9
      # -- a stdlib signature that changed, a generic that is not subscriptable
      # there -- is invisible if mypy only ever runs on the newest leg.
      - name: Type-check (mypy)
        run: mypy --strict src/sofab

      - name: Assert the native accelerator was built
        # setup.py marks the extension `optional=True` so a compiler-less host
        # still installs — which means a failed compile only prints a warning and
        # installs the pure-Python build. Every native-gated test is behind
        # `pytest.importorskip`, so without this gate a broken accelerator would
        # skip itself out of the run and leave the leg green with the parity
        # tests (and half the coverage) silently gone. CORELIB_PLAN §12.1 step 5
        # wants the full suite run, not the part that still imports.
        run: |
          python -c "import sofab, sys; sys.exit(0 if sofab.IMPL == 'native' else f'native accelerator missing: sofab.IMPL == {sofab.IMPL!r}')"

      - name: Test (native engine)
        env:
          SOFAB_REQUIRE_ENGINE: native
        run: pytest

      - name: Test (pure-Python engine)
        # Both engines ship, so both are run: the native↔pure parity tests only
        # pin the two to each other and cannot stand in for either alone.
        # SOFAB_REQUIRE_ENGINE makes each run assert which engine it got, so
        # neither can vanish from CI unnoticed (tests/test_engine_guard.py).
        env:
          SOFAB_PUREPYTHON: '1'
          SOFAB_REQUIRE_ENGINE: python
        run: pytest

  fallback:
    name: Pure-Python fallback install (no native build)
    needs: [lint]
    runs-on: ubuntu-latest
    # ~15-20 s: no compile, one pytest run.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install without the native accelerator
        # The install a host without a C compiler gets. The README promises this
        # fallback works, so CI builds and tests it instead of assuming it.
        env:
          SOFAB_DISABLE_NATIVE: '1'
        run: python -m pip install -e . pytest

      - name: Assert the pure-Python fallback is active
        run: |
          python -c "import sofab, sys; sys.exit(0 if sofab.IMPL == 'python' else f'expected the pure-Python fallback: sofab.IMPL == {sofab.IMPL!r}')"

      - name: Test
        env:
          SOFAB_REQUIRE_ENGINE: python
        run: pytest

  coverage:
    name: Coverage
    needs: [lint]
    runs-on: ubuntu-latest
    # ~25-35 s including the badge publish.
    timeout-minutes: 15
    permissions:
      contents: write # to publish the generated badge to the `badges` branch
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install package and tooling
        run: python -m pip install -e . pytest pytest-cov coverage

      - name: Run tests with coverage
        # Coverage is measured against the pure-Python engine. coverage.py can
        # only instrument Python bytecode, and the native accelerator
        # (sofab._speedups) is a compiled, line-for-line mirror of the pure
        # encoder/decoder whose behaviour is proven identical by the full suite
        # passing under the native engine (the `test` jobs above) plus the
        # byte-exact native<->pure parity tests. Measuring the native engine
        # here would under-report, since its compiled hot path is invisible to
        # coverage.py.
        env:
          SOFAB_PUREPYTHON: '1'
          SOFAB_REQUIRE_ENGINE: python
        run: pytest --cov=sofab --cov-report=term-missing

      - name: Compute coverage badge data
        id: cov
        run: |
          coverage json -o coverage_py.json
          pct=$(python -c "import json; print(f\"{json.load(open('coverage_py.json'))['totals']['percent_covered']:.0f}\")")
          if   [ "$pct" -ge 90 ]; then color=brightgreen
          elif [ "$pct" -ge 75 ]; then color=green
          elif [ "$pct" -ge 50 ]; then color=yellow
          else color=red; fi
          echo "Coverage: ${pct}% (${color})"
          echo "pct=${pct}" >> "$GITHUB_OUTPUT"
          mkdir -p badge
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "$pct" "$color" > badge/coverage.json

      - name: Publish badge to the badges branch
        # Only from CI runs on main itself: PRs (ref refs/pull/*/merge) and runs
        # on any other branch must not move the published badge.
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./badge
          publish_branch: badges
          force_orphan: true
          commit_message: "chore(badge): update coverage to ${{ steps.cov.outputs.pct }}%"
